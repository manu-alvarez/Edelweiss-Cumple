<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edelweiss · Invitación Audiovisual</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cinzel:wght@600&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
<style>
:root { --gold:#ffd700; --pink:#ffb6e6; --deep:#0c0614; }
* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; background:var(--deep); color:#fff; font-family:'Quicksand',sans-serif; overflow-x:hidden; }
#particles { position:fixed; inset:0; z-index:6; pointer-events:none; }
#snow { position:fixed; inset:0; z-index:3; pointer-events:none; }
#sound { position:fixed; top:14px; right:14px; z-index:400; width:48px; height:48px; border-radius:50%; background:rgba(0,0,0,.6); border:1px solid var(--gold); color:var(--gold); font-size:1.2rem; cursor:pointer; }

#cover { position:fixed; inset:0; z-index:300; background:radial-gradient(ellipse at center,#1a0a2e 0%,#0c0614 70%); display:flex; flex-direction:column; align-items:center; justify-content:center; transition:opacity 1.4s; }
#cover.hidden { opacity:0; pointer-events:none; }
.game { text-align:center; margin:12px 0; }
.castle { font-size:4rem; border:2px dashed rgba(255,215,0,0.5); border-radius:20px; padding:8px 25px; display:inline-block; transition:all 0.3s; }
.castle.ready { border-color:#ffd700; box-shadow:0 0 25px rgba(255,215,0,0.6); }
.items { display:flex; gap:20px; justify-content:center; margin:15px 0; }
.item { font-size:2.8rem; cursor:pointer; user-select:none; transition:transform 0.2s; }
.item:active { transform:scale(1.2); }
.msg { min-height:36px; font-size:1.25rem; margin:8px 0; }
.start-btn { background:linear-gradient(135deg,#ffd700,#ffaa00); border:none; padding:16px 40px; border-radius:40px; font-size:1.2rem; font-weight:700; color:#301934; cursor:pointer; display:none; margin-top:10px; }

#video-stage {
  position:relative; min-height:100vh; min-height:100dvh;
  display:flex; align-items:center; justify-content:center;
  background:#000; overflow:hidden;
}
#main-video {
  width:100%; height:100%; object-fit:cover;
  max-height:100vh; max-height:100dvh;
}
.video-overlay {
  position:absolute; inset:0; display:flex; flex-direction:column;
  align-items:center; justify-content:flex-end; padding-bottom:8vh;
  background:linear-gradient(to top, rgba(0,0,0,.65) 0%, transparent 50%);
  z-index:10; pointer-events:none;
}
.video-overlay * { pointer-events:auto; }
.enter-btn {
  background:linear-gradient(135deg,#ffd700,#ffaa00); border:none;
  padding:16px 44px; border-radius:50px; font-size:1.25rem; font-weight:600;
  color:#301934; cursor:pointer; box-shadow:0 0 35px rgba(255,215,0,.5);
  animation:pulse 2.2s infinite; font-family:'Quicksand',sans-serif;
}
@keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }

.scene {
  position:relative; min-height:100vh; display:flex; align-items:center; justify-content:center;
  overflow:hidden; padding:2rem 1rem;
}
.bg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:.35; filter:brightness(.4); z-index:1; }
.content {
  position:relative; z-index:10; text-align:center; max-width:560px;
  opacity:0; transform:translateY(50px); transition:all 1.1s ease;
}
.content.on { opacity:1; transform:translateY(0); }
h1 { font-family:'Great Vibes',cursive; font-size:clamp(2.8rem,9vw,5rem); color:var(--gold); text-shadow:0 0 30px rgba(255,215,0,.5); }
h2 { font-family:'Cinzel',serif; letter-spacing:3px; color:var(--pink); margin:.3rem 0 1.2rem; }
p { font-size:1.15rem; line-height:1.7; }
.glass {
  background:rgba(12,6,20,.55); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(255,215,0,.25); border-radius:26px; padding:2rem 1.6rem;
}
.medal { width:100px; height:100px; border-radius:50%; border:3px solid var(--gold); object-fit:cover; box-shadow:0 0 20px var(--gold); margin:1rem auto; display:block; }
.btn { display:inline-block; margin:.4rem; padding:14px 30px; border-radius:40px; text-decoration:none; font-weight:600; }
.btn-g { background:linear-gradient(135deg,#ffd700,#ffaa00); color:#301934; }
.btn-o { background:transparent; color:#fff; border:1px solid var(--gold); }
</style>
</head>
<body>
<canvas id="particles"></canvas>
<canvas id="snow"></canvas>
<button id="sound">🔊</button>

<div id="cover">
  <h1 style="font-family:'Great Vibes',cursive; font-size:2.8rem; color:var(--gold); margin-bottom:8px;">Edelweiss</h1>
  <p>Toca las estrellas para ponerlas en el castillo</p>
  <div class="game">
    <div class="castle" id="castle">🏰</div>
    <div class="items">
      <span class="item" data-ok="1">✨</span>
      <span class="item" data-ok="1">🌟</span>
      <span class="item" data-ok="0">👑</span>
    </div>
  </div>
  <div class="msg" id="msg">¡Toca las estrellas!</div>
  <button class="start-btn" id="start" onclick="startVideo()">✨ Ver el Decreto ✨</button>
</div>

<div id="video-stage" style="display:none;">
  <video id="main-video" autoplay playsinline loop>
    <source src="4974524d-7173-462d-b077-a033334dec92.mp4" type="video/mp4">
  </video>
  <div class="video-overlay">
    <button class="enter-btn" onclick="continueInvitation()">✨ Continuar la Invitación ✨</button>
  </div>
</div>

<section class="scene" id="invitation" style="display:none;">
  <img src="hero.jpg" class="bg" alt="">
  <div class="content obs glass">
    <h1>Edelweiss</h1>
    <h2>Cumple 4 Años</h2>
    <img src="medal.jpg" class="medal" alt="">
    <p>Viernes, 15 de Noviembre · 17:00 h<br>El Gran Castillo</p>
    <div style="margin-top:1.5rem;">
      <a href="URL_GOOGLE_MAPS" class="btn btn-o" target="_blank">📍 Mapa</a>
      <a href="https://wa.me/NUMERO_WHATSAPP?text=¡Hola!%20Confirmo%20asistencia%20al%20cumpleaños%20de%20Edelweiss%20👑✨" class="btn btn-g" target="_blank">💌 Confirmar</a>
    </div>
  </div>
</section>

<script>
const video = document.getElementById('main-video');
const soundBtn = document.getElementById('sound');
let unmuted = true;

function tryPlayWithSound() {
  video.muted = false;
  video.volume = 0.7;
  video.play().then(() => { soundBtn.textContent = '🔊'; unmuted = true; })
               .catch(() => { video.muted = true; video.play(); soundBtn.textContent = '🔇'; unmuted = false; });
}

soundBtn.onclick = () => {
  if (unmuted) { video.muted = true; soundBtn.textContent = '🔇'; }
  else { video.muted = false; video.play(); soundBtn.textContent = '🔊'; }
  unmuted = !unmuted;
};

let collected = 0;
const castle = document.getElementById('castle');
const msg = document.getElementById('msg');

document.querySelectorAll('.item').forEach(item => {
  item.onclick = () => {
    if (item.dataset.ok === '1') {
      item.style.transform = 'scale(0)';
      item.style.opacity = '0';
      setTimeout(() => item.style.display = 'none', 300);
      collected++;
      burst();
      if (collected >= 2) {
        castle.classList.add('ready');
        msg.textContent = '¡Magia lista! 🎉';
        document.getElementById('start').style.display = 'inline-block';
        celebrate();
      } else {
        msg.textContent = '¡Bien! Una más';
      }
    } else {
      msg.textContent = 'Toca las estrellas ✨';
      item.style.transform = 'scale(1.3) rotate(15deg)';
      setTimeout(() => item.style.transform = '', 250);
    }
  };
});

function burst() {
  for (let i = 0; i < 10; i++) {
    const s = document.createElement('div');
    s.textContent = '✨';
    s.style.cssText = `position:fixed; left:${Math.random()*100}vw; top:45%; font-size:1.6rem; z-index:400; animation:pop .7s ease-out forwards; pointer-events:none;`;
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 700);
  }
}

function celebrate() {
  for (let i = 0; i < 35; i++) {
    setTimeout(() => {
      const s = document.createElement('div');
      s.textContent = ['✨','🌟','🎉'][i%3];
      s.style.cssText = `position:fixed; left:${Math.random()*100}vw; top:-20px; font-size:${1.4+Math.random()}rem; z-index:400; animation:fall 2s linear forwards; pointer-events:none;`;
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 2000);
    }, i * 35);
  }
}

function startVideo() {
  document.getElementById('cover').classList.add('hidden');
  document.getElementById('video-stage').style.display = 'flex';
  tryPlayWithSound();
}

function continueInvitation() {
  document.getElementById('video-stage').style.display = 'none';
  const inv = document.getElementById('invitation');
  inv.style.display = 'flex';
  setTimeout(() => inv.querySelector('.content').classList.add('on'), 100);
}

// Nieve
const snow = document.getElementById('snow');
const sctx = snow.getContext('2d');
function snowR() { snow.width = innerWidth; snow.height = innerHeight; }
addEventListener('resize', snowR); snowR();
let flakes = Array.from({length:60}, () => ({x:Math.random()*snow.width, y:Math.random()*snow.height, r:Math.random()*2.5+1, s:Math.random()+0.4}));
function snowLoop() {
  sctx.clearRect(0,0,snow.width,snow.height);
  sctx.fillStyle = 'rgba(255,255,255,0.7)';
  flakes.forEach(f => {
    sctx.beginPath(); sctx.arc(f.x, f.y, f.r, 0, Math.PI*2); sctx.fill();
    f.y += f.s; if (f.y > snow.height) f.y = -5;
  });
  requestAnimationFrame(snowLoop);
}
snowLoop();

const c = document.getElementById('particles');
const ctx = c.getContext('2d');
let ps = [];
function rs() { c.width = innerWidth; c.height = innerHeight; }
addEventListener('resize', rs); rs();
class P {
  constructor() { this.x=Math.random()*c.width; this.y=Math.random()*c.height; this.s=Math.random()*1.8+.4; this.vy=Math.random()*-.6-.2; this.a=Math.random()*.4+.15; }
  u() { this.y+=this.vy; if(this.y<-5){this.y=c.height; this.x=Math.random()*c.width;} }
  d() { ctx.fillStyle=`rgba(255,215,0,${this.a})`; ctx.beginPath(); ctx.arc(this.x,this.y,this.s,0,Math.PI*2); ctx.fill(); }
}
for(let i=0;i<120;i++) ps.push(new P());
(function loop() { ctx.clearRect(0,0,c.width,c.height); ps.forEach(p=>{p.u();p.d();}); requestAnimationFrame(loop); })();

const style = document.createElement('style');
style.textContent = `@keyframes fall { to { transform: translateY(110vh) rotate(360deg); opacity: 0; } }
@keyframes pop { 0% { transform: scale(0.4); opacity:1; } 100% { transform: scale(1.4) translateY(-30px); opacity:0; } }`;
document.head.appendChild(style);
</script>
</body>
</html>
