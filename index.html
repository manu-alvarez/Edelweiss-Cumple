<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reino Encantado de Edelweiss - Invitaciones</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; background: radial-gradient(circle at center, #2a0845 0%, #0b0510 100%); color: white; font-family: 'Fredoka', sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; }
        h1 { font-family: 'Great Vibes', cursive; font-size: 3.5rem; color: #ffd700; text-shadow: 0 0 20px rgba(255,215,0,0.6); margin-bottom: 10px; }
        h2 { color: #ffb6c1; font-weight: 400; margin-bottom: 40px; }
        .versions { display: flex; flex-direction: column; gap: 20px; max-width: 420px; width: 100%; }
        a.version { display: block; padding: 20px; background: rgba(255,215,0,0.15); border: 1px solid #ffd700; border-radius: 20px; text-decoration: none; color: white; font-size: 1.3rem; font-weight: 600; transition: all 0.3s; backdrop-filter: blur(10px); }
        a.version:hover { background: rgba(255,215,0,0.3); transform: scale(1.05); box-shadow: 0 0 30px rgba(255,215,0,0.5); }
        .note { margin-top: 40px; font-size: 0.9rem; color: #aaa; }
    </style>
</head>
<body>
    <h1>Edelweiss</h1>
    <h2>Elige tu invitación al Reino Encantado</h2>
    <div class="versions">
        <a href="v1/" class="version">✨ Portal al Reino Encantado</a>
        <a href="v2/" class="version">📜 El Manuscrito del Rey</a>
        <a href="v3/" class="version">👑 El Decreto Real (Híbrida)</a>
    </div>
    <p class="note">Cada versión tiene su propia página mágica.<br>¡Prepárate para la aventura del 15 de noviembre!</p>
</body>
</html>
